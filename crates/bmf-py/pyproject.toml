[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "FPMsBMF"
description = "Factorisation matricielle booleenne : structures bit-packees et solveurs exacts"
requires-python = ">=3.8"
dependencies = ["numpy>=1.20"]
dynamic = ["version"]

readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Flavio Drogo", email = "230736@umons.ac.be" }]
keywords = [
    "boolean-matrix-factorization",
    "bmf",
    "bitset",
    "role-mining",
    "combinatorial-optimization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/16Flavio/FPMsBMF"
Repository = "https://github.com/16Flavio/FPMsBMF"
Issues = "https://github.com/16Flavio/FPMsBMF/issues"

[project.optional-dependencies]
test = ["pytest"]
bench = ["numpy"]

[tool.maturin]
features = ["pyo3/extension-module"]
include = ["FPMsBMF.pyi", "py.typed"]