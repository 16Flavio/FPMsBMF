[package]
name = "bmf-py"
version = "0.1.0"
edition = "2021"

[lib]
name = "FPMsBMF"
crate-type = ["cdylib", "rlib"]
bench = false

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py38"] }
numpy = "0.23"
boolmat = { path = "../boolmat" }
bmf-core = { path = "../bmf-core" }